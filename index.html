<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yamaha RX-V6A Sidebar</title>
    <style>
        :root {
            --bg-base: #121212;
            --bg-container: #1e1e1e;
            --accent: #ff9800;
            --text-main: #e0e0e0;
            --border-color: #333;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-container);
            color: var(--text-main);
            font-family: Arial, sans-serif;
            user-select: none;
        }

        .container {
            width: 100%;
            height: 100vh;
            position: relative;
            padding: 8px 6px 4px 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #444 transparent;
        }

        .container::-webkit-scrollbar {
            width: 3px;
        }

        .container::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 2px;
        }

        h2 {
            margin: 0 0 4px 0;
            color: var(--accent);
            font-size: clamp(10px, 1.5vh, 13px);
            text-align: center;
        }

        .section {
            margin-bottom: 4px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        input[type="text"] {
            width: 90%;
            padding: 4px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            text-align: center;
            font-size: clamp(11px, 1.4vh, 13px);
        }

        button {
            background-color: #333;
            color: white;
            border: none;
            padding: clamp(4px, 0.9vh, 8px) 8px;
            margin: 1px;
            border-radius: 4px;
            cursor: pointer;
            font-size: clamp(10px, 1.3vh, 12px);
            transition: 0.2s;
        }

        button:hover {
            background-color: #555;
        }

        button.active {
            background-color: var(--accent) !important;
            color: black !important;
            font-weight: bold;
            box-shadow: 0 0 6px var(--accent);
        }

        .power-btn {
            background-color: #d32f2f;
        }

        .power-btn:hover {
            background-color: #f44336;
        }

        .mute-btn {
            background-color: #444444;
            width: 100%;
            margin: 3px 0px 0px 0px;
        }

        .volume-container {
            display: flex;
            justify-content: space-between;
            gap: 4px;
        }

        .volume-container button {
            flex: 1;
        }

        label {
            font-size: 0.7rem;
        }

        #knobWrapper {
            width: clamp(90px, 15vh, 145px);
            height: clamp(90px, 15vh, 145px);
            background: radial-gradient(circle, #181818 0%, #0d0d0d 70%);
            border: 1px solid #2a2a2a;
            border-radius: 50%;
            margin: 4px auto;
            position: relative;
            cursor: ns-resize;
            touch-action: none;
            box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.9), 0 3px 8px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .knob {
            background: linear-gradient(145deg, #2a2a2a, #151515);
            border: 3px solid #383838;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.9), inset 0 1px 4px rgba(255, 255, 255, 0.08);
            transform: rotate(-135deg);
            z-index: 2;
        }

        #volumeKnob {
            width: 70%;
            height: 70%;
        }

        .knob-indicator {
            position: absolute;
            left: 50%;
            background-color: var(--accent);
            transform: translateX(-50%);
            border-radius: 2px;
            box-shadow: 0 0 6px var(--accent);
        }

        #volumeKnob .knob-indicator {
            top: 3px;
            width: 2px;
            height: 12px;
        }

        .neon-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #333;
            border-radius: 50%;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        .neon-dot-tone {
            position: absolute;
            width: 2px;
            height: 2px;
            background-color: #333;
            border-radius: 50%;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        .neon-dot.lit {
            background-color: var(--accent);
            box-shadow: 0 0 4px var(--accent), 0 0 6px var(--accent);
        }

        .neon-dot-tone.lit {
            background-color: var(--accent);
            box-shadow: 0 0 4px var(--accent), 0 0 6px var(--accent);
        }

        .tone-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 2px;
        }

        .tone-card {
            background: #252525;
            padding: 4px;
            border-radius: 6px;
            border: 1px solid #333;
            text-align: center;
        }

        .tone-card label {
            font-size: clamp(9px, 1.2vh, 11px);
            color: #aaa;
            display: block;
        }

        .tone-card span {
            font-weight: bold;
            color: var(--accent);
            font-size: clamp(9px, 1.2vh, 11px);
        }

        .tone-knob-wrapper {
            width: clamp(45px, 7vh, 65px);
            height: clamp(45px, 7vh, 65px);
            margin: 2px auto;
            position: relative;
            cursor: ns-resize;
            touch-action: none;
            background: radial-gradient(circle, #181818 0%, #0d0d0d 70%);
            border: 1px solid #2a2a2a;
            border-radius: 50%;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.9), 0 2px 5px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tone-knob {
            width: 68%;
            height: 68%;
        }

        .tone-knob .knob-indicator {
            top: 2px;
            width: 2px;
            height: 7px;
        }

        #volDisplay {
            font-weight: bold;
            color: var(--accent);
            font-size: clamp(11px, 1.5vh, 14px);
        }

        .visualizer-container {
            background: #151515;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 1px;
            margin-top: 2px;
        }

        canvas {
            display: block;
            width: 100%;
            height: clamp(27px, 4.2vh, 42px);
            background: #0d0d0d;
            border-radius: 3px;
        }

        .speakers-status {
            display: flex;
            justify-content: center;
            margin-top: 3px;
        }

        .spk-badge {
            background: rgba(76, 175, 80, 0.15);
            border: 1px solid #4caf50;
            border-radius: 4px;
            padding: 3px 6px;
            font-size: clamp(9px, 1.2vh, 11px);
            color: #4caf50;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
            width: 100%;
        }

        .spk-badge.no-signal {
            background: rgba(158, 158, 158, 0.08);
            border: 1px solid #444;
            color: #777;
            box-shadow: none;
        }

        .dsp-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
            margin-top: 2px;
        }

        .dsp-grid button {
            width: 96%;
            margin: 0;
            padding: clamp(4px, 0.8vh, 6px) 1px;
            font-size: clamp(9px, 1.1vh, 10px);
        }

        #customTitleBar {
            display: none;
            height: 22px;
            background: #181818;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px;
            -webkit-app-region: drag;
            border-bottom: 1px solid #333;
            margin: -8px -12px 6px -12px;
        }

        #customTitleBar.unlocked {
            display: flex;
        }

        .title-text {
            font-size: 10px;
            color: var(--accent);
            font-weight: bold;
        }

        .window-controls {
            display: flex;
            gap: 2px;
        }

        .window-controls button {
            -webkit-app-region: no-drag;
            background: transparent;
            border: none;
            color: #aaa;
            width: 18px;
            height: 18px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 9px;
            margin: 0;
            padding: 0;
        }

        .window-controls button:hover {
            background: #333;
            color: #fff;
        }

        .window-controls button.close-btn:hover {
            background: #e81123;
            color: #fff;
        }

        .neon-dot.lit.color-green {
            background-color: #4caf50;
            box-shadow: 0 0 4px #4caf50, 0 0 6px #4caf50;
        }

        .neon-dot.lit.color-blue {
            background-color: #2196f3;
            box-shadow: 0 0 4px #2196f3, 0 0 6px #2196f3;
        }

        .neon-dot.lit.color-red {
            background-color: #f44336;
            box-shadow: 0 0 4px #f44336, 0 0 6px #f44336;
        }

        #volumeKnob .knob-indicator.color-green {
            background-color: #4caf50;
            box-shadow: 0 0 6px #4caf50;
        }

        #volumeKnob .knob-indicator.color-blue {
            background-color: #2196f3;
            box-shadow: 0 0 6px #2196f3;
        }

        #volumeKnob .knob-indicator.color-red {
            background-color: #f44336;
            box-shadow: 0 0 6px #f44336;
        }

        #refreshBtn {
            position: fixed;
            top: 4px;
            right: 4px;
            z-index: 9999;
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            backdrop-filter: blur(3px);
        }

        #refreshBtn:hover {
            background: rgba(50, 50, 50, 1);
            border-color: var(--accent);
        }

        #zoomMinus {
            position: fixed;
            top: 4px;
            left: 4px;
            z-index: 9999;
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            backdrop-filter: blur(3px);
        }

        #zoomMinus:hover {
            background: rgba(50, 50, 50, 1);
            border-color: var(--accent);
        }

        #zoomPlus {
            position: fixed;
            top: 4px;
            left: 24px;
            z-index: 9999;
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            backdrop-filter: blur(3px);
        }

        #zoomPlus:hover {
            background: rgba(50, 50, 50, 1);
            border-color: var(--accent);
        }

        #channelOutLabel,
        #channelOut {
            font-size: clamp(9px, 1.2vh, 11px);
        }
    </style>
</head>

<body>

    <div class="container">
        <button id="refreshBtn" onclick="location.reload()" title="Refresh Page (Ctrl+R)">↻</button>
        <button id="zoomMinus" onclick="changeZoom(-0.1)" title="Zoom out (Ctrl+Shift+-)">-</button>
        <button id="zoomPlus" onclick="changeZoom(0.1)" title="Zoom in (Ctrl++)">+</button>
        <div id="customTitleBar">
            <span class="title-text">Yamaha RX-V6A (Unlocked)</span>
            <div class="window-controls">
                <button onclick="require('electron').ipcRenderer.send('window-min')">🗕</button>
                <button onclick="require('electron').ipcRenderer.send('window-max')">🗖</button>
                <button class="close-btn" onclick="require('electron').ipcRenderer.send('window-close')">✕</button>
            </div>
        </div>

        <h2>Yamaha RX-V6A</h2>
        <div class="section">
            <input type="text" id="ipAddress" placeholder="Receiver IP address ex: 192.168.1.51">
        </div>

        <div class="section">
            <button class="power-btn" onclick="sendCmd('main/setPower?power=on')">Power On</button>
            <button class="power-btn" onclick="sendCmd('main/setPower?power=standby')">Power Off</button>
        </div>

        <div class="section">
            <label style="font-size: clamp(10px, 1.3vh, 12px);">Volume: <span id="volDisplay">-40.0 dB</span></label>

            <div class="knob-wrapper" id="knobWrapper">
                <div class="knob" id="volumeKnob">
                    <div class="knob-indicator"></div>
                </div>
            </div>

            <div class="volume-container">
                <button title="Volume down (Ctrl+ArrowDown)" onmousedown="startVolHold(-1.0)" onmouseup="stopVolHold()"
                    onttouchstart="startVolHold(-1.0)" ontouchend="stopVolHold()">Volume -</button>
                <button title="Volume up (Ctrl+ArrowUp)" onmousedown="startVolHold(1.0)" onmouseup="stopVolHold()"
                    onttouchstart="startVolHold(1.0)" ontouchend="stopVolHold()">Volume +</button>
            </div>
            <button id="muteBtn" class="mute-btn" onclick="toggleMute()">Mute</button>
        </div>

        <div class="section">
            <label><small><strong>Tone Adjustments</strong></small></label>

            <div class="tone-grid">
                <div class="tone-card">
                    <label>Bass: <span id="bassDisplay">0.0 dB</span></label>
                    <div class="knob-wrapper tone-knob-wrapper" id="bassWrapper" data-type="bass">
                        <div class="knob tone-knob" id="bassKnob">
                            <div class="knob-indicator"></div>
                        </div>
                    </div>
                </div>

                <div class="tone-card">
                    <label>Treble: <span id="trebleDisplay">0.0 dB</span></label>
                    <div class="knob-wrapper tone-knob-wrapper" id="trebleWrapper" data-type="treble">
                        <div class="knob tone-knob" id="trebleKnob">
                            <div class="knob-indicator"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tone-card" style="margin-top: 3px;">
                <label>Subwoofer level: <span id="subDisplay">0.0 dB</span></label>
                <div class="knob-wrapper tone-knob-wrapper" id="subWrapper" data-type="subwoofer">
                    <div class="knob tone-knob" id="subKnob">
                        <div class="knob-indicator"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="section">
            <label><small><strong>Input select</strong></small></label><br>
            <button id="input_hdmi1" onclick="selectInput('hdmi1')">HDMI 1</button>
            <button id="input_hdmi2" onclick="selectInput('hdmi2')">HDMI 2</button>
            <button id="input_net_radio" onclick="selectInput('net_radio')">Net Radio</button>
        </div>

        <div class="section" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
            <label><small><strong>DSP Mode</strong></small></label>
            <div class="dsp-grid">
                <button id="dsp_pure_direct" onclick="setPureDirect(!isPureDirect)">Pure Direct</button>
                <button id="dsp_straight" onclick="setDspProgram('straight')">Straight</button>
                <button id="dsp_dsur" onclick="setDspProgram('surr_decoder')">Surround Decoder</button>
                <button id="dsp_all_ch_stereo" onclick="setDspProgram('all_ch_stereo')">All Channel Stereo</button>
            </div>
        </div>

        <div style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
            <div class="visualizer-container">
                <canvas id="vizCanvas" style="display: none;"></canvas>
                <canvas id="waveCanvas" style="display: none;"></canvas>
            </div>
            <label id="channelOutLabel" style="margin-top: 2px; display: block;">Channel Out: <span
                    id="channelOut">-</span></label>
            <div class="speakers-status">
                <div id="signalInfoBadge" class="spk-badge">SIGNAL: ---</div>
            </div>
        </div>
    </div>
    <script>
        const CONFIG = {
            pollIntervalMs: 150,
            get throttleSend() { return this.pollIntervalMs * 0.8; },
            get releaseDelay() { return this.pollIntervalMs * 10; }
        };

        let statusInterval = null;
        let currentDb = -40.0, currentBass = 0.0, currentTreble = 0.0, currentSub = 0.0;
        let isMuted = false, currentInput = '', currentDsp = '', isPureDirect = false;

        let signalTextDisplay = "No Signal";

        let isInteractingVol = false;
        let isInteractingBass = false;
        let isInteractingTreble = false;
        let isInteractingSub = false;
        let isInteractingInput = false;
        let isInteractingDsp = false;

        let volTimeout = null;
        let bassTimeout = null;
        let trebleTimeout = null;
        let subTimeout = null;
        let inputTimeout = null;
        let dspTimeout = null;

        const minDb = -80.5, maxDb = 0.0;
        const minTone = -6.0, maxTone = 6.0;
        const minAngle = -135, maxAngle = 135;

        let audioAnalyser = null;
        let dataArray = null;

        async function startRealAudioCapture() {
            try {
                if (audioAnalyser) return;

                const stream = await navigator.mediaDevices.getDisplayMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
                    video: { width: 1, height: 1 }
                });

                const videoTrack = stream.getVideoTracks()[0];
                if (videoTrack) videoTrack.stop();

                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                audioCtx.onerror = (err) => {
                    console.warn("AudioContext error:", err);
                    audioAnalyser = null;
                    dataArray = null;
                    stopWaveAnimations();
                    startWaveAnimations();
                };

                audioCtx.onstatechange = () => {
                    if (audioCtx.state === 'closed' || audioCtx.state === 'interrupted') {
                        audioAnalyser = null;
                        dataArray = null;
                        stopWaveAnimations();
                        startWaveAnimations();
                    }
                };

                const source = audioCtx.createMediaStreamSource(stream);
                audioAnalyser = audioCtx.createAnalyser();

                audioAnalyser.fftSize = 8192 * 2;
                source.connect(audioAnalyser);

                dataArray = new Uint8Array(audioAnalyser.frequencyBinCount);

                stopWaveAnimations();
                console.log("Attached audio stream!");

            } catch (err) {
                audioAnalyser = null;
                dataArray = null;
            }
        }

        const canvas = document.getElementById('vizCanvas');
        const ctx = canvas.getContext('2d');

        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                const dpr = window.devicePixelRatio || 1;
                const rect = entry.contentRect;

                canvas.width = Math.round(rect.width * dpr);
                canvas.height = Math.round(Math.max(12, entry.target.offsetHeight - 2) * dpr);

                // ctx.resetTransform();
                // ctx.scale(dpr, dpr);
            }
        });
        resizeObserver.observe(canvas.parentElement);

        let bars = 40;
        let barValues = new Array(bars).fill(0);
        let peakValues = new Array(bars).fill(0);
        let peakVelocities = new Array(bars).fill(0);
        let peakHoldTimes = new Array(bars).fill(0);

        function drawVisualizer() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!audioAnalyser || !dataArray) {
                document.getElementById('signalInfoBadge').innerText = signalTextDisplay;
                requestAnimationFrame(drawVisualizer);
                return;
            }

            if (audioAnalyser.fftSize !== 8192 * 2) {
                audioAnalyser.fftSize = 8192 * 2;
            }

            let barWidth = (canvas.width / bars) - 1;

            try {
                audioAnalyser.getByteFrequencyData(dataArray);
            } catch (e) {
                audioAnalyser = null;
                dataArray = null;
                startWaveAnimations();
                requestAnimationFrame(drawVisualizer);
                return;
            }

            const hasRealAudio = !dataArray.every(val => val === 0);

            if (hasRealAudio && signalTextDisplay !== "NO SIGNAL") {
                if (canvas.style.display === 'none') {
                    stopWaveAnimations();
                }

                const bufferLength = audioAnalyser.frequencyBinCount;
                const sampleRate = audioAnalyser.context.sampleRate;
                const nyquist = sampleRate / 2;

                const minAudibleFreq = 20;
                const maxAudibleFreq = Math.min(20000, nyquist);

                const minLog = Math.log10(minAudibleFreq);
                const maxLog = Math.log10(maxAudibleFreq);

                for (let i = 0; i < bars; i++) {
                    let fLow = Math.pow(10, minLog + (i / bars) * (maxLog - minLog));
                    let fHigh = Math.pow(10, minLog + ((i + 1) / bars) * (maxLog - minLog));

                    let floatStart = (fLow / nyquist) * bufferLength;
                    let floatEnd = (fHigh / nyquist) * bufferLength;

                    let weightedSum = 0;
                    let totalWeight = 0;

                    let startBin = Math.floor(floatStart);
                    let endBin = Math.min(Math.ceil(floatEnd), bufferLength);

                    for (let j = startBin; j < endBin; j++) {
                        let binLeft = j;
                        let binRight = j + 1;

                        let overlap = Math.max(0, Math.min(binRight, floatEnd) - Math.max(binLeft, floatStart));
                        if (overlap > 0) {
                            weightedSum += dataArray[j] * overlap;
                            totalWeight += overlap;
                        }
                    }

                    let avgVal = totalWeight > 0 ? (weightedSum / totalWeight) : 0;
                    let normalized = Math.min(1, Math.sqrt(avgVal / 255.0));

                    // 0.98 leaave a space for the avg line, using pow in order to increase dynamic here, but keep the max values intact.
                    let scaledNormalized = 0.98 * Math.pow(normalized, 1.71);

                    barValues[i] += (scaledNormalized - barValues[i]) * 0.45;

                    let barHeight = barValues[i] * canvas.height;
                    let x = i * (barWidth + 1);
                    let y = canvas.height - barHeight;

                    // Peak hold
                    if (barHeight >= peakValues[i]) {
                        peakValues[i] = barHeight;
                        peakVelocities[i] = 0;
                        peakHoldTimes[i] = 50; // Holds for n frames 
                    } else {
                        if (peakHoldTimes[i] > 0) {
                            peakHoldTimes[i]--;
                        } else {
                            peakVelocities[i] += 0.005; // Slowly falls
                            peakValues[i] -= peakVelocities[i];

                            if (peakValues[i] < barHeight) {
                                peakValues[i] = barHeight;
                                peakVelocities[i] = 0;
                            }
                        }
                    }

                    let gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
                    gradient.addColorStop(0, '#d32f2f');
                    gradient.addColorStop(0.6, '#ff9800');
                    gradient.addColorStop(1, '#ffeb3b');

                    ctx.fillStyle = gradient;
                    ctx.fillRect(x, y, barWidth, Math.max(2, barHeight));

                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(x, canvas.height - peakValues[i] - 1, barWidth, 1);
                }
            } else {
                if (canvas.style.display !== 'none') {
                    startWaveAnimations();
                }
            }

            document.getElementById('signalInfoBadge').innerText = signalTextDisplay;
            requestAnimationFrame(drawVisualizer);
        }

        drawVisualizer();

        function createNeonDotsForWrapper(wrapperId, radius, centerX, centerY, isTone) {
            const wrapper = document.getElementById(wrapperId);
            if (!wrapper) return;
            const totalDots = isTone ? 13 : 21;
            wrapper.querySelectorAll(isTone ? '.neon-dot-tone' : '.neon-dot').forEach(d => d.remove());
            for (let i = 0; i < totalDots; i++) {
                let percent = i / (totalDots - 1);
                let angleDeg = minAngle + percent * (maxAngle - minAngle);
                let angleRad = (angleDeg - 90) * (Math.PI / 180);
                let x = centerX + radius * Math.cos(angleRad) - 2;
                let y = centerY + radius * Math.sin(angleRad) - 2;

                const dot = document.createElement('div');
                dot.className = isTone ? 'neon-dot-tone' : 'neon-dot';
                dot.style.left = `${x}px`;
                dot.style.top = `${y}px`;
                dot.dataset.percent = percent;
                wrapper.appendChild(dot);
            }
        }

        function updateNeonDotsForWrapper(wrapperId, percentage) {
            const wrapper = document.getElementById(wrapperId);
            if (!wrapper) return;

            let colorClass = 'color-orange';
            let hexColor = '#ff9800';

            if (wrapperId === 'knobWrapper') {
                if (percentage > 0.9) {
                    colorClass = 'color-red';
                    hexColor = '#f44336';
                } else if (percentage > 0.7) {
                    colorClass = 'color-blue';
                    hexColor = '#2196f3';
                } else if (percentage > 0.50) {
                    colorClass = 'color-green';
                    hexColor = '#4caf50';
                }

                const mainIndicator = document.querySelector('#volumeKnob .knob-indicator');
                if (mainIndicator) {
                    mainIndicator.classList.remove('color-green', 'color-blue', 'color-red');
                    mainIndicator.classList.add(colorClass);
                }

                const volDisplay = document.getElementById('volDisplay');
                if (volDisplay) {
                    volDisplay.style.color = hexColor;
                }
            }

            wrapper.querySelectorAll('.neon-dot').forEach(dot => {
                let isLit = parseFloat(dot.dataset.percent) <= percentage;

                dot.classList.remove('lit', 'color-green', 'color-blue', 'color-red', 'color-orange');

                if (isLit) {
                    dot.classList.add('lit');
                    dot.classList.add(colorClass);
                }
            });
            wrapper.querySelectorAll('.neon-dot-tone').forEach(dot => {
                let isLit = parseFloat(dot.dataset.percent) <= percentage;

                dot.classList.remove('lit', 'color-green', 'color-blue', 'color-red', 'color-orange');

                if (isLit) {
                    dot.classList.add('lit');
                    dot.classList.add(colorClass);
                }
            });
        }

        function snapToStep(val) { return Math.round(val * 2) / 2; }

        function dbToYamaha(db) {
            let clamped = Math.max(minDb, Math.min(maxDb, snapToStep(db)));
            return Math.round((clamped - minDb) / 0.5);
        }

        function yamahaToDb(yamahaVal) { return snapToStep(minDb + (yamahaVal * 0.5)); }

        function updateKnobVisual(db) {
            let snappedDb = Math.max(minDb, Math.min(maxDb, snapToStep(db)));
            let percentage = (snappedDb - minDb) / (maxDb - minDb);
            let angle = minAngle + percentage * (maxAngle - minAngle);
            document.getElementById('volumeKnob').style.transform = `rotate(${angle}deg)`;
            document.getElementById('volDisplay').innerText = `${snappedDb.toFixed(1)} dB`;
            updateNeonDotsForWrapper('knobWrapper', percentage);
        }

        function setToneKnobVisual(wrapperId, knobId, displayId, val) {
            let snapped = Math.max(minTone, Math.min(maxTone, snapToStep(val)));
            let percentage = (snapped - minTone) / (maxTone - minTone);
            let angle = minAngle + percentage * (maxAngle - minAngle);
            document.getElementById(knobId).style.transform = `rotate(${angle}deg)`;
            document.getElementById(displayId).innerText = `${snapped > 0 ? '+' : ''}${snapped.toFixed(1)} dB`;
            updateNeonDotsForWrapper(wrapperId, percentage);
        }

        function updateToneVisuals() {
            if (!isInteractingBass) setToneKnobVisual('bassWrapper', 'bassKnob', 'bassDisplay', currentBass);
            if (!isInteractingTreble) setToneKnobVisual('trebleWrapper', 'trebleKnob', 'trebleDisplay', currentTreble);
            if (!isInteractingSub) setToneKnobVisual('subWrapper', 'subKnob', 'subDisplay', currentSub);
        }

        function updateUIState() {
            const muteBtn = document.getElementById('muteBtn');
            if (isMuted) {
                muteBtn.classList.add('active'); muteBtn.innerText = 'Mute: On';
            } else {
                muteBtn.classList.remove('active'); muteBtn.innerText = 'Mute';
            }

            if (!isInteractingInput) {
                ['hdmi1', 'hdmi2', 'net_radio'].forEach(inp => {
                    const btn = document.getElementById(`input_${inp}`);
                    if (btn) {
                        let cleanCurrent = (currentInput || '').toLowerCase().replace(/[_-\s]/g, '');
                        let cleanInp = inp.toLowerCase().replace(/[_-\s]/g, '');
                        btn.classList.toggle('active', cleanCurrent === cleanInp);
                    }
                });
            }

            if (!isInteractingDsp) {
                const pdBtn = document.getElementById('dsp_pure_direct');
                if (pdBtn) pdBtn.classList.toggle('active', isPureDirect);

                const straightBtn = document.getElementById('dsp_straight');
                const dsurBtn = document.getElementById('dsp_dsur');
                const allChStereoBtn = document.getElementById('dsp_all_ch_stereo');

                if (straightBtn) straightBtn.classList.toggle('active', !isPureDirect && currentDsp === 'straight');
                if (dsurBtn) dsurBtn.classList.toggle('active', !isPureDirect && currentDsp === 'surr_decoder');
                if (allChStereoBtn) allChStereoBtn.classList.toggle('active', !isPureDirect && currentDsp === 'all_ch_stereo');
            }
        }

        function isValidIp(ip) {
            return /^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/.test(ip);
        }

        function sendCmd(endpoint) {
            const ip = document.getElementById('ipAddress').value.trim();
            if (!isValidIp(ip)) return;
            fetch(`http://${ip}/YamahaExtendedControl/v1/${endpoint}`, { method: 'GET', mode: 'no-cors' }).catch(() => { });
        }

        function sendXmlCmd(xmlBody) {
            const ip = document.getElementById('ipAddress').value.trim();
            if (!isValidIp(ip)) return Promise.reject();
            return fetch(`http://${ip}/YamahaRemoteControl/ctrl`, {
                method: 'POST', mode: 'cors', credentials: 'omit',
                headers: {
                    'accept': 'application/xml, text/xml, */*; q=0.01',
                    'content-type': 'text/xml',
                    'x-requested-with': 'XMLHttpRequest'
                },
                body: xmlBody
            });
        }

        function selectInput(inputName) {
            if (inputTimeout) clearTimeout(inputTimeout);
            isInteractingInput = true;
            currentInput = inputName;
            updateUIState();
            sendCmd(`main/setInput?input=${inputName}`);
            inputTimeout = setTimeout(() => { isInteractingInput = false; }, CONFIG.releaseDelay);
        }

        function setDspProgram(dspName) {
            if (dspTimeout) clearTimeout(dspTimeout);
            isInteractingDsp = true;
            isPureDirect = false;
            currentDsp = dspName;
            updateUIState();
            sendCmd(`main/setSoundProgram?program=${dspName}`);
            dspTimeout = setTimeout(() => { isInteractingDsp = false; }, CONFIG.releaseDelay);
        }

        function setPureDirect(enable) {
            if (dspTimeout) clearTimeout(dspTimeout);
            isInteractingDsp = true;
            isPureDirect = enable;
            updateUIState();

            sendCmd(`main/setPureDirect?enable=${enable ? 'true' : 'false'}`);

            dspTimeout = setTimeout(() => { isInteractingDsp = false; }, CONFIG.releaseDelay);
        }

        function sendToneCommand(type, val) {
            let snapped = Math.max(minTone, Math.min(maxTone, snapToStep(val)));
            let valInt = Math.round(snapped * 10);
            let xml = '';

            if (type === 'bass') {
                currentBass = snapped;
                setToneKnobVisual('bassWrapper', 'bassKnob', 'bassDisplay', currentBass);
                xml = `<YAMAHA_AV cmd="PUT"><Main_Zone><Sound_Video><Tone><Bass><Val>${valInt}</Val><Exp>1</Exp><Unit>dB</Unit></Bass></Tone></Sound_Video></Main_Zone></YAMAHA_AV>`;
            } else if (type === 'treble') {
                currentTreble = snapped;
                setToneKnobVisual('trebleWrapper', 'trebleKnob', 'trebleDisplay', currentTreble);
                xml = `<YAMAHA_AV cmd="PUT"><Main_Zone><Sound_Video><Tone><Treble><Val>${valInt}</Val><Exp>1</Exp><Unit>dB</Unit></Treble></Tone></Sound_Video></Main_Zone></YAMAHA_AV>`;
            } else if (type === 'subwoofer') {
                currentSub = snapped;
                setToneKnobVisual('subWrapper', 'subKnob', 'subDisplay', currentSub);
                xml = `<YAMAHA_AV cmd="PUT"><Main_Zone><Volume><Subwoofer_Trim><Val>${valInt}</Val><Exp>1</Exp><Unit>dB</Unit></Subwoofer_Trim></Volume></Main_Zone></YAMAHA_AV>`;
            }

            sendXmlCmd(xml);
        }

        function fetchStatusJson() {
            if (isInteractingVol) return;
            const ip = document.getElementById('ipAddress').value.trim();
            if (!isValidIp(ip)) return;

            fetch(`http://${ip}/YamahaExtendedControl/v1/main/getStatus`, { cache: 'no-store' })
                .then(res => res.json())
                .then(data => {
                    if (data && data.response_code === 0) {
                        isMuted = data.mute;
                        if (!isInteractingInput) currentInput = data.input;
                        if (!isInteractingDsp) {
                            isPureDirect = data.pure_direct || false;
                            currentDsp = data.sound_program;
                        }
                        currentDb = snapToStep(yamahaToDb(data.volume));
                        updateKnobVisual(currentDb);
                        updateUIState();
                    }
                })
                .catch(() => { });

            fetch(`http://${ip}/YamahaExtendedControl/v1/main/getSignalInfo`, { cache: 'no-store' })
                .then(res => res.json())
                .then(data => {
                    const badge = document.getElementById('signalInfoBadge');

                    if (data && data.response_code === 0 && data.audio && data.audio.format && data.audio.format !== "---") {
                        let format = data.audio.format.toUpperCase();
                        let fsVal = data.audio.fs;

                        if (fsVal !== undefined && fsVal !== null && fsVal !== "" && fsVal !== "---") {
                            let fsStr = String(fsVal).trim();
                            if (!fsStr.toLowerCase().includes('khz') && !fsStr.toLowerCase().includes('hz')) {
                                let num = parseFloat(fsStr);
                                if (!isNaN(num)) {
                                    fsStr = (num > 1000 ? num / 1000 : num).toFixed(1).replace('.0', '') + " kHz";
                                }
                            }
                            signalTextDisplay = `${format} ${fsStr}`;
                        } else {
                            signalTextDisplay = format;
                        }

                        if (badge) badge.classList.remove('no-signal');
                    } else {
                        signalTextDisplay = "NO SIGNAL";
                        if (badge) badge.classList.add('no-signal');
                    }
                }).catch(() => {
                    signalTextDisplay = "NO SIGNAL";
                    const badge = document.getElementById('signalInfoBadge');
                    if (badge) badge.classList.add('no-signal');
                });
        }

        function fetchToneXml() {
            if (isInteractingBass && isInteractingTreble && isInteractingSub) return;
            const ip = document.getElementById('ipAddress').value.trim();
            if (!isValidIp(ip)) return;

            let xmlQuery = `<YAMAHA_AV cmd="GET"><Main_Zone><Basic_Status>GetParam</Basic_Status></Main_Zone></YAMAHA_AV>`;

            sendXmlCmd(xmlQuery)
                .then(res => res.text())
                .then(str => {
                    const parser = new window.DOMParser();
                    const xmlDoc = parser.parseFromString(str, "text/xml");

                    function getVal(tagName) {
                        const elements = xmlDoc.getElementsByTagName(tagName);
                        if (elements.length > 0) {
                            const valEl = elements[0].getElementsByTagName('Val')[0];
                            const expEl = elements[0].getElementsByTagName('Exp')[0];
                            if (valEl) {
                                let val = parseFloat(valEl.textContent);
                                let exp = expEl ? parseInt(expEl.textContent) : 1;
                                return val / Math.pow(10, exp);
                            }
                        }
                        return null;
                    }

                    if (!isInteractingBass) {
                        let b = getVal('Bass');
                        if (b !== null) currentBass = snapToStep(b);
                    }
                    if (!isInteractingTreble) {
                        let t = getVal('Treble');
                        if (t !== null) currentTreble = snapToStep(t);
                    }
                    if (!isInteractingSub) {
                        let s = getVal('Subwoofer_Trim');
                        if (s !== null) currentSub = snapToStep(s);
                    }

                    updateToneVisuals();
                }).catch(() => { });
        }

        function fetchAllStatus() {
            fetchStatusJson();
            fetchToneXml();
        }

        function updateChannelOut() {
            const label = document.getElementById('channelOut');
            if (signalTextDisplay !== "NO SIGNAL") {
                getSpeakerConfig().then(speakers => {
                    // TODO: get whether setup is 5.1.2 or 7.1.0. We do currently support only 5.1.2
                    const regularCount = 0 + 2 * speakers.front + speakers.center + 2 * speakers.surround;
                    const subsCount = 0 + speakers.sub;
                    const atmosCount = 0 + 2 * speakers.front_presence;
                    const format = signalTextDisplay.split(' ')[0].toLowerCase();
                    if (format === 'pcm') {
                        if (isPureDirect) {
                            label.innerText = `2.0.0`;
                        } else {
                            if (currentDsp === 'surr_decoder' || currentDsp === 'all_ch_stereo') {
                                label.innerText = `${regularCount}.${subsCount}.${atmosCount}`;
                            } else if (currentDsp === 'straight') {
                                label.innerText = `${regularCount}.${subsCount}.0`;
                            }
                        }

                    } else {
                        label.innerText = `${regularCount}.${subsCount}.${atmosCount}`;
                    }
                });

            } else {
                label.innerText = '---';
            }
        }

        function restartPolling() {
            if (statusInterval) clearInterval(statusInterval);
            statusInterval = setInterval(fetchAllStatus, CONFIG.pollIntervalMs);
            setInterval(updateChannelOut, 2000);
        }

        function setAbsoluteVolume(db) {
            currentDb = Math.max(minDb, Math.min(maxDb, snapToStep(db)));
            updateKnobVisual(currentDb);
            sendCmd(`main/setVolume?volume=${dbToYamaha(currentDb)}`);
            isMuted = false;
            updateUIState();
        }

        function changeVolStep(deltaDb) {
            if (volTimeout) clearTimeout(volTimeout);
            isInteractingVol = true;
            setAbsoluteVolume(currentDb + deltaDb);
            volTimeout = setTimeout(() => { isInteractingVol = false; }, CONFIG.releaseDelay);
            isMuted = false;
            updateUIState();
        }

        function initNeonDots() {
            const mainWrapperEl = document.getElementById('knobWrapper');
            const bassWrapperEl = document.getElementById('bassWrapper');

            if (mainWrapperEl && bassWrapperEl) {
                createNeonDotsForWrapper('knobWrapper', mainWrapperEl.offsetWidth * 0.425, mainWrapperEl.offsetWidth / 2, mainWrapperEl.offsetHeight / 2, false);
                createNeonDotsForWrapper('bassWrapper', bassWrapperEl.offsetWidth * 0.4, bassWrapperEl.offsetWidth / 2, bassWrapperEl.offsetHeight / 2, true);
                createNeonDotsForWrapper('trebleWrapper', bassWrapperEl.offsetWidth * 0.4, bassWrapperEl.offsetWidth / 2, bassWrapperEl.offsetHeight / 2, true);
                createNeonDotsForWrapper('subWrapper', bassWrapperEl.offsetWidth * 0.4, bassWrapperEl.offsetWidth / 2, bassWrapperEl.offsetHeight / 2, true);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initNeonDots();
            window.addEventListener('resize', initNeonDots);

            const ipInput = document.getElementById('ipAddress');
            if (ipInput) {
                ipInput.value = localStorage.getItem('yamaha_ip') || '192.168.1.51';

                ipInput.addEventListener('input', () => {
                    const val = ipInput.value.trim();
                    localStorage.setItem('yamaha_ip', val);
                    if (isValidIp(val)) {
                        fetchAllStatus();
                    }
                });

                fetchAllStatus();
            }

            const attachKnobEvents = (wrapperId, type) => {
                const wrapper = document.getElementById(wrapperId);
                if (!wrapper) return;

                let startY = 0, startVal = 0, dragging = false;
                let lastSendTime = 0;

                const getCurrVal = () => {
                    if (type === 'vol') return currentDb;
                    if (type === 'bass') return currentBass;
                    if (type === 'treble') return currentTreble;
                    if (type === 'subwoofer') return currentSub;
                };

                const onStart = (clientY) => {
                    dragging = true;
                    startY = clientY;
                    startVal = getCurrVal();

                    if (type === 'vol') {
                        if (volTimeout) clearTimeout(volTimeout);
                        isInteractingVol = true;
                    }
                    if (type === 'bass') {
                        if (bassTimeout) clearTimeout(bassTimeout);
                        isInteractingBass = true;
                    }
                    if (type === 'treble') {
                        if (trebleTimeout) clearTimeout(trebleTimeout);
                        isInteractingTreble = true;
                    }
                    if (type === 'subwoofer') {
                        if (subTimeout) clearTimeout(subTimeout);
                        isInteractingSub = true;
                    }
                };

                const onMove = (clientY) => {
                    if (!dragging) return;
                    let deltaY = startY - clientY;

                    if (type === 'vol') {
                        let rawCalc = startVal + (deltaY / 400) * (maxDb - minDb);
                        currentDb = Math.max(minDb, Math.min(maxDb, snapToStep(rawCalc)));

                        updateKnobVisual(currentDb);

                        let now = Date.now();
                        if (now - lastSendTime > CONFIG.throttleSend) {
                            lastSendTime = now;
                            sendCmd(`main/setVolume?volume=${dbToYamaha(currentDb)}`);
                        }
                    } else {
                        let calcVal = Math.max(minTone, Math.min(maxTone, startVal + (deltaY / 250) * (maxTone - minTone)));
                        let snapped = snapToStep(calcVal);

                        if (type === 'bass') {
                            currentBass = snapped;
                            setToneKnobVisual('bassWrapper', 'bassKnob', 'bassDisplay', currentBass);
                        }
                        if (type === 'treble') {
                            currentTreble = snapped;
                            setToneKnobVisual('trebleWrapper', 'trebleKnob', 'trebleDisplay', currentTreble);
                        }
                        if (type === 'subwoofer') {
                            currentSub = snapped;
                            setToneKnobVisual('subWrapper', 'subKnob', 'subDisplay', currentSub);
                        }

                        let now = Date.now();
                        if (now - lastSendTime > CONFIG.throttleSend) {
                            lastSendTime = now;
                            sendToneCommand(type, getCurrVal());
                        }
                    }
                };

                const onEnd = () => {
                    if (!dragging) return;
                    dragging = false;

                    if (type === 'vol') {
                        setAbsoluteVolume(currentDb);
                        volTimeout = setTimeout(() => { isInteractingVol = false; }, CONFIG.releaseDelay);
                    } else {
                        sendToneCommand(type, getCurrVal());
                        if (type === 'bass') bassTimeout = setTimeout(() => { isInteractingBass = false; }, CONFIG.releaseDelay);
                        if (type === 'treble') trebleTimeout = setTimeout(() => { isInteractingTreble = false; }, CONFIG.releaseDelay);
                        if (type === 'subwoofer') subTimeout = setTimeout(() => { isInteractingSub = false; }, CONFIG.releaseDelay);
                    }
                };

                wrapper.addEventListener('mousedown', e => { onStart(e.clientY); e.preventDefault(); });
                window.addEventListener('mousemove', e => onMove(e.clientY));
                window.addEventListener('mouseup', onEnd);

                wrapper.addEventListener('touchstart', e => { onStart(e.touches[0].clientY); }, { passive: true });
                window.addEventListener('touchmove', e => { if (dragging) onMove(e.touches[0].clientY); }, { passive: true });
                window.addEventListener('touchend', onEnd);

                wrapper.addEventListener('wheel', e => {
                    let step = e.deltaY < 0 ? 0.5 : -0.5;
                    if (type === 'vol') {
                        if (volTimeout) clearTimeout(volTimeout);
                        isInteractingVol = true;
                        setAbsoluteVolume(currentDb + step);
                        volTimeout = setTimeout(() => { isInteractingVol = false; }, CONFIG.releaseDelay);
                    } else {
                        if (type === 'bass') { if (bassTimeout) clearTimeout(bassTimeout); isInteractingBass = true; }
                        if (type === 'treble') { if (trebleTimeout) clearTimeout(trebleTimeout); isInteractingTreble = true; }
                        if (type === 'subwoofer') { if (subTimeout) clearTimeout(subTimeout); isInteractingSub = true; }

                        let newVal = getCurrVal() + step;
                        sendToneCommand(type, newVal);

                        if (type === 'bass') bassTimeout = setTimeout(() => { isInteractingBass = false; }, CONFIG.releaseDelay);
                        if (type === 'treble') trebleTimeout = setTimeout(() => { isInteractingTreble = false; }, CONFIG.releaseDelay);
                        if (type === 'subwoofer') subTimeout = setTimeout(() => { isInteractingSub = false; }, CONFIG.releaseDelay);
                    }
                    e.preventDefault();
                }, { passive: false });
            };

            attachKnobEvents('knobWrapper', 'vol');
            attachKnobEvents('bassWrapper', 'bass');
            attachKnobEvents('trebleWrapper', 'treble');
            attachKnobEvents('subWrapper', 'subwoofer');

            restartPolling();
            startRealAudioCapture();
            updateChannelOut();
        });

        function toggleMute() {
            isMuted = !isMuted;
            updateUIState();
            sendXmlCmd(`<YAMAHA_AV cmd="PUT"><Main_Zone><Volume><Mute>${isMuted ? 'On' : 'Off'}</Mute></Volume></Main_Zone></YAMAHA_AV>`);
        }

        const { ipcRenderer } = require('electron');
        ipcRenderer.on('toggle-lock', (event, unlocked) => {
            const titleBar = document.getElementById('customTitleBar');
            const refreshBtn = document.getElementById('refreshBtn');

            if (unlocked) {
                titleBar.classList.add('unlocked');
                if (refreshBtn) refreshBtn.style.display = 'none';
            } else {
                titleBar.classList.remove('unlocked');
                if (refreshBtn) refreshBtn.style.display = 'flex';
            }
        });

        ipcRenderer.on('global-volume-adjust', (event, delta) => {
            changeVolStep(delta);
        });

        let volHoldInterval = null;

        function startVolHold(deltaDb) {
            if (volHoldInterval) clearInterval(volHoldInterval);

            changeVolStep(deltaDb);

            volHoldInterval = setInterval(() => {
                changeVolStep(deltaDb);
            }, 120);
        }

        function stopVolHold() {
            if (volHoldInterval) {
                clearInterval(volHoldInterval);
                volHoldInterval = null;
            }
        }

        window.addEventListener('mouseup', stopVolHold);
        window.addEventListener('touchend', stopVolHold);
        window.addEventListener('touchcancel', stopVolHold);

        const waveCanvas = document.getElementById('waveCanvas');
        const waveCtx = waveCanvas.getContext('2d');

        let animationId;
        let time = 0;

        const waves = [
            { speed: 0.015, amplitude: 20, color: 'rgba(33, 150, 243, 0.6)' }, // blue
            { speed: 0.02, amplitude: 15, color: 'rgba(255, 87, 34, 0.5)' },   // orange
            { speed: 0.01, amplitude: 25, color: 'rgba(76, 175, 80, 0.4)' }    // green
        ];

        function resizeCanvas() {
            waveCanvas.width = waveCanvas.parentElement.offsetWidth;
            waveCanvas.height = Math.max(12, waveCanvas.parentElement.offsetHeight - 2);
        }

        function drawWaves() {
            waveCtx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);

            const width = waveCanvas.width;
            const height = waveCanvas.height;
            const centerY = height / 2;

            waves.forEach(wave => {
                waveCtx.beginPath();
                waveCtx.lineWidth = 1;
                waveCtx.strokeStyle = wave.color;
                waveCtx.moveTo(0, centerY);

                for (let x = 0; x < width; x++) {
                    const y = centerY + Math.sin(x * 0.01 + time * wave.speed) * wave.amplitude;
                    const gradient = Math.sin(x / width * Math.PI);
                    const easedY = centerY + (y - centerY) * gradient;
                    waveCtx.lineTo(x, easedY);
                }
                waveCtx.stroke();
            });

            time += 1;
            animationId = requestAnimationFrame(drawWaves);
        }

        function startWaveAnimations() {
            const viz = document.getElementById('vizCanvas');
            const wave = document.getElementById('waveCanvas');
            if (viz) viz.style.display = 'none';
            if (wave) wave.style.display = 'block';

            resizeCanvas();
            if (!animationId) {
                drawWaves();
            }
        }

        function stopWaveAnimations() {
            const viz = document.getElementById('vizCanvas');
            const wave = document.getElementById('waveCanvas');
            if (wave) wave.style.display = 'none';
            if (viz) viz.style.display = 'block';

            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = undefined;
            }
        }

        let reconnectInterval = null;

        function checkAndReconnectAudio() {
            if (!audioAnalyser) {
                console.log("Trying to restore audio stream...");
                startRealAudioCapture();
            }
        }

        reconnectInterval = setInterval(checkAndReconnectAudio, 3000);

        ipcRenderer.on('global-volume-adjust', (event, delta) => {
            changeVolStep(delta);
        });

        async function getSpeakerConfig() {
            const ip = document.getElementById('ipAddress').value.trim();
            const url = `http://${ip}/YamahaRemoteControl/ctrl`;

            const channelsToFetch = {
                sub: "Subwoofer Subwoofer_1", // Nested (separate by space)
                front: "Front",
                center: "Center",
                surround: "Sur",
                surr_back: "Sur_Back",
                front_presence: "Front_Presence"
            };

            const result = {
                sub: false,
                front: false,
                center: false,
                surround: false,
                surr_back: false,
                front_presence: false,
            };

            for (const [key, selector] of Object.entries(channelsToFetch)) {
                const mainTag = selector.split(' ')[0];
                const xmlBody = `<YAMAHA_AV cmd="GET"><System><Speaker_Preout><Pattern_1><Config><${mainTag}>GetParam</${mainTag}></Config></Pattern_1></Speaker_Preout></System></YAMAHA_AV>`;

                try {
                    const response = await fetch(url, {
                        method: "POST",
                        headers: {
                            "Content-Type": "text/xml",
                            "X-Requested-With": "XMLHttpRequest"
                        },
                        body: xmlBody
                    });

                    const textResponse = await response.text();
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(textResponse, "text/xml");

                    const element = xmlDoc.querySelector(`${selector} Type`) || xmlDoc.querySelector(selector);
                    const statusValue = element ? element.textContent.trim() : "";

                    const isNone = !statusValue || statusValue.toLowerCase() === 'none';
                    result[key] = !isNone;
                } catch (error) {
                    console.error(`Error in getSpeakerConfig. Channel ${key}:`, error);
                    result[key] = false;
                }
            }

            return result;
        }

        function changeZoom(delta) {
            try {
                const { ipcRenderer } = require('electron');
                if (ipcRenderer) {
                    ipcRenderer.send('change-zoom', delta);
                }
            } catch (e) { }
        }
    </script>
